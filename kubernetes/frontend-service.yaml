apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: genaihub-frontend
spec:
  # ClusterIP avoids binding host port 3000 (conflicts with docker compose).
  # Use: kubectl port-forward svc/frontend-service 3000:3000
  type: ClusterIP
  selector:
    app: genaihub-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
