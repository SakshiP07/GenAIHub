apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: genaihub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genaihub-frontend
  template:
    metadata:
      labels:
        app: genaihub-frontend
    spec:
      containers:
        - name: frontend
          image: genaihub-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: BACKEND_URL
              value: http://backend-service:5000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
